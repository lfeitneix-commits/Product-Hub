<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hub de Productos Neix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap">
<style>
/* Layout: app de dos zonas. Sidebar grafito fija (desktop) + contenido crema; en mobile, barra superior y tab bar inferior. Fichas con estética del nuevo one pager. */
:root{
  --bg:#F4F1ED; --surface:#FFFFFF; --surface-2:#EFEBE6; --surface-3:#E7E1D9;
  --ink:#33312E; --ink-2:#6A635A; --ink-3:#958C80; --line:#E3DDD5; --line-2:#D6CEC3;
  --arena:#9A8E7D; --sel:#3D3D3D; --sel-ink:#F7F5F3;
  --side:#2E2D2B; --side-ink:#EDE8E1; --side-2:#A49C90; --side-hi:rgba(255,255,255,.08);
  --ok:#4C7558; --ok-bg:#E3EDE5; --warn:#94661C; --warn-bg:#F5EBD9; --crit:#9C4636; --crit-bg:#F4E2DD;
  --shadow:0 1px 2px rgba(40,35,30,.05),0 6px 20px -12px rgba(40,35,30,.18);
  --shadow-hi:0 2px 4px rgba(40,35,30,.06),0 16px 32px -16px rgba(40,35,30,.28);
  --focus:#7E705E; --logo-a:block; --logo-b:none;
  /* papel del cliente: siempre claro, a propósito */
  --paper:#FFFFFF; --paper-2:#F3EFEA; --paper-ink:#33312E; --paper-ink-2:#6A635A; --paper-line:#E3DDD5; --paper-dark:#33312E; --paper-arena:#9A8E7D;
  --f-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --f-body:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1918; --surface:#232220; --surface-2:#2C2A27; --surface-3:#35322E;
  --ink:#ECE7E0; --ink-2:#B6AEA3; --ink-3:#8C8479; --line:#383430; --line-2:#48433E;
  --arena:#B8AB96; --sel:#ECE7E0; --sel-ink:#1A1918;
  --side:#121211; --side-ink:#ECE7E0; --side-2:#8F877C; --side-hi:rgba(255,255,255,.07);
  --ok:#8DBB98; --ok-bg:#22322A; --warn:#DDB167; --warn-bg:#3A2F1C; --crit:#E39483; --crit-bg:#3B2420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -12px rgba(0,0,0,.6); --shadow-hi:0 2px 4px rgba(0,0,0,.3),0 16px 32px -16px rgba(0,0,0,.7);
  --focus:#CDBFA8; --logo-a:none; --logo-b:block; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1918; --surface:#232220; --surface-2:#2C2A27; --surface-3:#35322E;
  --ink:#ECE7E0; --ink-2:#B6AEA3; --ink-3:#8C8479; --line:#383430; --line-2:#48433E;
  --arena:#B8AB96; --sel:#ECE7E0; --sel-ink:#1A1918;
  --side:#121211; --side-ink:#ECE7E0; --side-2:#8F877C; --side-hi:rgba(255,255,255,.07);
  --ok:#8DBB98; --ok-bg:#22322A; --warn:#DDB167; --warn-bg:#3A2F1C; --crit:#E39483; --crit-bg:#3B2420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -12px rgba(0,0,0,.6); --shadow-hi:0 2px 4px rgba(0,0,0,.3),0 16px 32px -16px rgba(0,0,0,.7);
  --focus:#CDBFA8; --logo-a:none; --logo-b:block; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--arena);font-weight:600}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px} .num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── Shell ── */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:22px 14px 18px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.side .brand{display:flex;flex-direction:column;gap:8px;padding:0 10px 22px;text-decoration:none}
.side .brand img{height:16px;width:auto;align-self:flex-start}
.side .brand span{font-family:var(--f-display);font-size:15px;color:var(--side-2)}
.side nav{display:grid;gap:2px}
.nav-a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--side-2);font-size:14px;transition:background .15s,color .15s}
.nav-a:hover{background:var(--side-hi);color:var(--side-ink)}
.nav-a[aria-current="page"]{background:var(--side-hi);color:var(--side-ink);font-weight:600}
.nav-a .count{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--side-ink);color:var(--side);font-size:11px;text-align:center;line-height:20px;font-weight:700}
.side .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--side-hi);font-size:12px;color:var(--side-2);display:grid;gap:4px}
.mtop{display:none}
.tabbar{display:none}
.content{min-width:0}
main{max-width:1160px;margin:0 auto;padding-block:30px 72px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.view{animation:enter .22s ease-out}
@keyframes enter{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── Encabezados ── */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:clamp(26px,3vw,34px);margin-top:4px}
.page-head p{margin-top:6px;max-width:64ch}

/* ── Controles ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:13.5px;line-height:1.3;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--arena)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)} .btn.primary:hover{opacity:.9}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)} .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.icon{padding:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:13.5px}
textarea.input{min-height:76px;resize:vertical}
label.f{display:grid;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:500}
label.f .hint{font-size:11.5px;color:var(--ink-3);font-weight:400}
.search{position:relative}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:19px;height:19px}
.search input{padding:13px 14px 13px 44px;font-size:15px;border-radius:12px;box-shadow:var(--shadow);border-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;line-height:1.2;white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--arena)}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none} .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}
.risk{display:inline-flex;gap:3px;align-items:center} .risk i{width:6px;height:6px;border-radius:50%;background:var(--line-2)} .risk i.on{background:var(--ink-2)}
.utag{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h3,.ph{font-size:16px;margin-bottom:10px}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink-2)}

/* ── Soluciones ── */
.needs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:18px 0 20px}
.need{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .15s;min-width:0}
.need:hover{border-color:var(--arena);transform:translateY(-1px)}
.need .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.need b{font-size:13px;font-weight:600;line-height:1.3}
.need span.n{font-size:11.5px;color:var(--ink-3)}
.need[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.need[aria-pressed="true"] .ic{background:rgba(255,255,255,.14);color:var(--sel-ink)} .need[aria-pressed="true"] span.n{color:inherit;opacity:.7}
.filters{display:grid;gap:10px;padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.frow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-width:0}
.frow .lbl{font-size:11.5px;color:var(--ink-3);font-weight:600;min-width:52px}
.frow .chips{flex:1;min-width:0}
.rescount{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);padding-top:4px}
.group{margin-top:24px}
.group-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.group-h .ic{width:30px;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.group-h h2{font-size:20px} .group-h span{font-size:12.5px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-width:0;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi);border-color:var(--line-2)}
.card h3{font-size:17.5px;line-height:1.25}
.card .tit{color:var(--ink-2);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.card .units{display:flex;gap:4px;flex-wrap:wrap}

/* ── Ficha ── */
.crumb{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;margin-bottom:12px}
.crumb a{text-decoration:none;color:var(--ink-2)} .crumb a:hover{color:var(--ink)}
.p-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.p-hero .ic{width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center} .p-hero .ic .ico{width:22px;height:22px}
.p-hero h1{font-size:clamp(22px,2.6vw,28px);margin:3px 0 2px}
.p-hero .sub{color:var(--ink-2);font-size:13.5px}
.p-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.p-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.aside{position:sticky;top:20px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px} .kv dt{color:var(--ink-3)} .kv dd{margin:0}

/* One pager en pantalla */
.op{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.op-hero{padding:24px 26px 20px;background:var(--surface-2);display:grid;gap:8px}
.op-hero img{height:14px;width:auto}
.op-hero h2{font-size:clamp(22px,2.5vw,28px);line-height:1.2;margin-top:8px}
.op-hero p{color:var(--ink-2);font-size:15px;max-width:62ch}
.op-body{padding:4px 26px 22px}
.op-sec{padding:16px 0;border-bottom:1px solid var(--line)}
.op-sec:last-child{border-bottom:0}
.op-sec h3,.op-h{font-size:17px;margin-bottom:8px}
.op-sec p{max-width:70ch}
.op-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{padding:10px 12px;border-right:1px solid var(--line);min-width:0} .facts div:last-child{border-right:0}
.facts dt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--arena);font-weight:600;margin-bottom:3px} .facts dd{margin:0;font-size:12.5px;line-height:1.35}
.blist{display:grid;gap:10px} .blist div{display:grid;gap:2px} .blist b{font-family:var(--f-display);font-weight:500;font-size:15px} .blist span{font-size:13px;color:var(--ink-2)}
ol.steps{list-style:none;padding:0;margin:0;display:grid;gap:7px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:6px;font-size:13.5px}
ol.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--f-display);color:var(--arena);font-size:13px;padding-top:1px}
ul.clean{margin:0;padding-left:17px;display:grid;gap:5px;font-size:13.5px}
.enneix{background:var(--sel);color:var(--sel-ink);padding:16px 18px;border-radius:10px}
.enneix .eyebrow{color:inherit;opacity:.65}
details.fold{border:1px solid var(--line);border-radius:10px}
details.fold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;font-weight:600;font-size:13.5px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:18px;color:var(--ink-3);font-weight:400}
details.fold[open]>summary::after{content:"–"}
details.fold>.in{padding:0 14px 14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0} td.r,th.r{text-align:right}
.tname{font-size:12.5px;font-weight:600;margin:10px 0 6px}

/* Playbook */
.pb{display:grid;gap:12px}
.pitch{font-family:var(--f-display);font-size:19px;line-height:1.45}
.pb3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pb2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.obj{display:grid;gap:8px} .obj div{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px} .obj b{display:block;margin-bottom:3px;font-weight:600}
.warnbox{background:var(--warn-bg);border-radius:var(--r);padding:12px 16px}
.warnbox summary{cursor:pointer;color:var(--warn);font-weight:700;font-size:12.5px;letter-spacing:.04em}
.warnbox ul{margin-top:8px}
.rel{display:flex;flex-wrap:wrap;gap:6px} .rel a{text-decoration:none}

/* Cliente */
.cl-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:12px}
.q{display:grid;gap:7px} .q h4{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--ink-2)}
.hold-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.res-sec{margin-bottom:20px}
.res-sec>h3{font-size:18px;margin-bottom:4px;display:flex;align-items:baseline;gap:8px}
.res-sec>p{margin-bottom:10px}
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.res .ic{width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;grid-row:span 2}
.res h4{font-size:16px} .res h4 a{text-decoration:none}
.res .why{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;border-radius:5px;padding:2px 7px;background:var(--surface-2);color:var(--ink-2)}
.tag.cond{background:var(--warn-bg);color:var(--warn)} .tag.no{background:var(--crit-bg);color:var(--crit)}
.demo{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);padding:2px 6px;border-radius:4px;font-weight:700}

/* Simuladores */
.sim{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--f-display);font-size:clamp(20px,2.4vw,25px);line-height:1.2;margin-top:4px}
.stat.hl{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)} .stat.hl .eyebrow{color:inherit;opacity:.65}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.chart svg{display:block;width:100%;height:auto}

/* Propuesta: editor */
.pr-grid{display:grid;grid-template-columns:370px minmax(0,1fr);gap:20px;align-items:start}
.pr-item{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pr-item .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.paper-wrap{background:var(--surface-3);border-radius:var(--r);padding:18px;min-width:0}
.paper-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--ink-2)}

/* Gestión */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sel);color:var(--sel-ink);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow-hi)}
.state{padding:70px 0;text-align:center;color:var(--ink-2)} .state h2{font-size:24px;color:var(--ink);margin-bottom:8px}

/* v3 */
.vars{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}.vars span{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink-2)}
.donut-wrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:center}
.donut-wrap svg{width:170px;height:170px}
.leg{display:grid;gap:6px;font-size:12.5px}.leg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center}.leg i{width:10px;height:10px;border-radius:2px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:8px;font-size:13px}
.alert.warn{background:var(--warn-bg)}.alert.crit{background:var(--crit-bg)}.alert.ok{background:var(--ok-bg)}
.alert b{display:block;margin-bottom:2px}
.dev{display:grid;grid-template-columns:minmax(0,1fr) 54px 54px 64px;gap:6px 10px;font-size:12.5px;align-items:center}
.dev .h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.dev .n{text-align:right;font-variant-numeric:tabular-nums}
.ai{border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.ai-acc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.ai-acc:first-of-type{border-top:0}
.ai-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--surface-2)}
.ai-tag.sumar{background:var(--ok-bg);color:var(--ok)}.ai-tag.reducir{background:var(--warn-bg);color:var(--warn)}
.pctot{font-size:12px;font-weight:600}.pctot.bad{color:var(--crit)}.pctot.okk{color:var(--ok)}
.ext-sec{margin-bottom:22px}.ext-sec h2{font-size:20px;margin-bottom:4px}.ext-sec>p{margin-bottom:10px}
@media (max-width:560px){.donut-wrap{grid-template-columns:minmax(0,1fr)}.donut-wrap svg{margin:0 auto}}
@media (max-width:1100px){.needs{grid-template-columns:repeat(3,minmax(0,1fr))}.p-grid{grid-template-columns:minmax(0,1fr)}.aside{position:static;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.facts{grid-template-columns:repeat(3,minmax(0,1fr))}.facts div:nth-child(3){border-right:0}.facts div:nth-child(-n+3){border-bottom:1px solid var(--line)}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);color:var(--side-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop img{height:14px} .mtop span{font-family:var(--f-display);color:var(--side-2);font-size:14px}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--side);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--side-2);text-decoration:none;padding:6px 2px;border-radius:8px;position:relative}
  .tabbar a[aria-current="page"]{color:var(--side-ink);background:var(--side-hi)}
  .tabbar .count{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;line-height:16px;border-radius:8px;background:var(--side-ink);color:var(--side);font-size:10px;font-weight:700;text-align:center}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 100px}
  .cl-grid,.sim,.pr-grid,.op-2,.pb2{grid-template-columns:minmax(0,1fr)}
  .pb3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .needs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .p-hero{grid-template-columns:auto minmax(0,1fr)} .p-hero .btn-row{grid-column:1/-1}
  .op-hero{padding:18px} .op-body{padding:2px 18px 18px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))} .facts div{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)} .facts div:nth-child(2n){border-right:0!important}
  .paper-wrap{padding:8px}
}

.side .brand span{color:#CFC6B8}

.need{transition:transform .15s,border-color .15s,box-shadow .15s}

.card{border-top:4px solid var(--u,var(--line-2));padding-top:14px}

function estadoDe(p){
  const v = S.vals[p.id];
  const vence = v && v.vence ? v.vence : p.vence;
  const d = daysTo(vence);
  if (d !== null && d < 0) return {k:"vencida", txt:"Vencida", cls:"crit", vence, d, v};

  return {k:"a_validar", txt:"A validar", cls:"warn", vence, d, v};
}

/* ── Matcher ── */
function evaluar(p, c){
  const m = p.match, r = {p, score:0, why:[], cond:[], no:[], tiene:false};
  const held = (c.tenencia||[]).map(h=>h.tag);
  if (m.tenencia.some(t=>held.includes(t))) r.tiene = true;
  if (c.tipo && !m.tipos.includes(c.tipo)) r.no.push("Pensado para " + m.tipos.map(t=>TIPO[t]).join(", ").toLowerCase());
  if (c.perfil) { const gap = p.riesgoNivel - PERFIL_MAX[c.perfil]; if (gap >= 2) r.no.push("Riesgo alto para un perfil " + PERFIL[c.perfil].toLowerCase()); else if (gap === 1) r.cond.push("Riesgo por encima del perfil: usar como parte menor"); }
  if (m.minimoUSD && c.patrimonio && Number(c.patrimonio) < m.minimoUSD) r.cond.push("Requiere desde " + usd(m.minimoUSD));
  c.objetivos.forEach(o => { if (m.objetivos.includes(o)) { r.score += 2; r.why.push(OBJ[o]); } });
  c.eventos.forEach(e => { if (m.eventos.includes(e)) { r.score += 3; r.why.push(EVT[e]); } });
  if (c.horizonte && m.horizonte.includes(c.horizonte)) r.score += 1;
  return r;
}
function resultados(){
  const c = S.cliente, out = {rec:[], pos:[], tiene:[], no:[], cross:[]};
  S.productos.map(p => evaluar(p, c)).forEach(r => {
    if (r.tiene) out.tiene.push(r);
    else if (r.no.length) out.no.push(r);
    else if (r.score >= 4 && !r.cond.length) out.rec.push(r);
    else if (r.score >= 2) out.pos.push(r);
  });
  out.rec.sort((a,b)=>b.score-a.score); out.pos.sort((a,b)=>b.score-a.score);
  const shown = new Set([...out.rec, ...out.pos, ...out.tiene].map(r=>r.p.id)), cross = {};
  out.tiene.forEach(r => r.p.interno.relacionados.forEach(id => { const q = S.byId[id]; if (!q || shown.has(id)) return; const e = evaluar(q, c); if (e.no.length || e.tiene) return; (cross[id] = cross[id] || {r:e, from:[]}).from.push(r.p.nombre); }));
  out.cross = Object.values(cross);
  return out;
}

async function save(id){
  const p = JSON.parse(JSON.stringify(S.byId[id]));
  document.querySelectorAll("#editForm [data-k]").forEach(el => {
    const t = el.dataset.t, raw = el.value; let v = raw.trim();
    if (t==="list") v = raw.split("\n").map(s=>s.trim()).filter(Boolean);
    if (t==="pairs") v = raw.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{ const i = s.indexOf("|"); return i<0 ? [s,""] : [s.slice(0,i).trim(), s.slice(i+1).trim()]; });
    setP(p, el.dataset.k, v);
  });
  p.ultimaRevision = todayISO();
  const b = document.querySelector('[data-act="save"]'); if (b) { b.disabled = true; b.textContent = "Guardando"; }
  try { await S.db.doc("productos/"+id).set(p); toast("Ficha guardada"); go("p-"+id); }
  catch(e) { toast(e && e.code === "permission_denied" ? "No tenés permiso para editar fichas" : "No se pudo guardar. Probá de nuevo."); if (b) { b.disabled = false; b.textContent = "Guardar cambios"; } }
}

/* ── Análisis de cartera ── */
function donut(parts, size){
  const tot = parts.reduce((a,p)=>a+p.v,0) || 1, R = 70, C = 2*Math.PI*R; let off = 0;
  return `<svg viewBox="0 0 180 180" width="${size||170}" height="${size||170}" role="img" aria-label="Composición de la cartera"><g transform="rotate(-90 90 90)">${parts.map((p,i)=>{ const len = C*p.v/tot, el = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${p.c||COLORS[i%COLORS.length]}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`; off += len; return el; }).join("")}</g></svg>`;
}
const tagProd = tag => S.productos.find(p=>(p.match.tenencia||[]).includes(tag));
function analisis(c){
  const h = c.tenencia||[], tot = h.reduce((a,x)=>a+x.usd,0)||1, al = [];
  const cls = {}; h.forEach(x=>{ cls[x.tag] = (cls[x.tag]||0) + x.usd; });
  h.forEach(x=>{ if (x.usd/tot > .35) al.push({k:"warn", t:"Concentración", d:`${x.activo} es el ${fmt(x.usd/tot*100,0)}% de la cartera.`}); });
  const liq = (cls.caucion||0)+(cls.fci||0);
  if (liq/tot < .05) al.push({k:"warn", t:"Liquidez baja", d:`Solo ${fmt(liq/tot*100,1)}% en instrumentos de liquidez inmediata.`, sug:["cauciones","fci"]});
  const ext = (cls.cedears||0)+(cls.fondos_off||0)+(cls.tbills||0)+(cls.offshore||0)+(cls.internacional||0)+(cls.notas||0);
  if (ext/tot < .15) al.push({k:"warn", t:"Exposición alta a riesgo argentino", d:`Solo ${fmt(ext/tot*100,0)}% diversificado afuera.`, sug:["fondos-offshore","t-bills","cuentas-offshore"]});
  let wr = 0; h.forEach(x=>{ const p = tagProd(x.tag); wr += (p?p.riesgoNivel:3)*x.usd/tot; });
  if (c.perfil && wr > PERFIL_MAX[c.perfil] + .3) al.push({k:"crit", t:"Riesgo por encima del perfil", d:`Riesgo promedio ${fmt(wr,1)} de 5 para un perfil ${PERFIL[c.perfil].toLowerCase()}.`});

function falCalc(v){

   <g font-size="12" fill="var(--ink-2)"><line x1="${L}" x2="${L+20}" y1="12" y2="12" stroke="var(--ink)" stroke-width="2.2"/><text x="${L+26}" y="16">Saldo del FAL</text>
   <line x1="${L+130}" x2="${L+150}" y1="12" y2="12" stroke="var(--arena)" stroke-width="2" stroke-dasharray="5 4"/><text x="${L+156}" y="16">Indemnizaciones estimadas por año</text></g></svg>`;

let H2P = null;
function loadH2P(){
  if (window.html2pdf) return Promise.resolve(window.html2pdf);
  if (H2P) return H2P;
  H2P = new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"; sc.onload = () => ok(window.html2pdf); sc.onerror = () => { H2P = null; ko(new Error("load")); }; document.head.appendChild(sc); });
  return H2P;
}

async function dlAsset(url, fname, btn){

  try { const r = await fetch(url); if (!r.ok) throw new Error("fetch"); const blob = await r.blob(); await S.dl.save({filename: fname.replace(/[\\/:*?"<>|]/g, ""), data: blob}); toast("One pager listo"); }

async function makePDF(markup, fname, btn){
  if (!S.dl) { toast("La descarga no está disponible en esta vista"); return; }
  const label = btn.innerHTML; btn.disabled = true; btn.textContent = "Generando PDF…";
  const host = document.createElement("div");
  host.style.cssText = "position:absolute;left:0;top:0;width:794px;background:#fff;z-index:-9999;pointer-events:none";
  host.innerHTML = markup; document.body.appendChild(host);
  try {
    const h2p = await loadH2P();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const el = host.firstElementChild; el.style.maxWidth = "none"; el.style.borderRadius = "0";
    const blob = await h2p().set({
      margin:[8,0,10,0], image:{type:"jpeg", quality:0.96},
      html2canvas:{scale:2, useCORS:true, backgroundColor:"#ffffff", windowWidth:794, scrollX:0, scrollY:0, x:0, y:0},
      jsPDF:{unit:"mm", format:"a4", orientation:"portrait"},
      pagebreak:{mode:["css","legacy"], avoid:[".pp-sec",".pp-item",".pp-glance tr",".pp-contact"]}
    }).from(el).outputPdf("blob");
    const name = fname.replace(/[\\/:*?"<>|]/g, "");
    await S.dl.save({filename: name, data: blob});
    toast("PDF listo");
  } catch(e) {
    if (!(e && e.code === "declined")) toast(e && e.code === "rate_limited" ? "Ya hay una descarga pendiente" : e && e.message === "load" ? "No se pudo cargar el generador de PDF. Revisá tu conexión." : "No se pudo generar el PDF. Probá de nuevo.");

}

function autoMsg(){
  const P = S.prop, c = S.cliente, n = P.items.length, objs = c.objetivos.map(o=>OBJ[o].toLowerCase()), monto = +P.monto || P.items.reduce((a,i)=>a+(+i.usd||0),0);
  const pre = objs.length ? `Como conversamos, el objetivo es ${listJoin(objs)}. ` : "Como conversamos, ";
  let m = pre;
  if (c.tenencia) m += (objs.length ? "Partimos" : "partimos") + " de tu cartera actual para ordenarla y diversificarla. ";
  const tc = `te compartimos`;
  m += `${m.endsWith(", ") ? tc : tc.charAt(0).toUpperCase()+tc.slice(1)} una propuesta con ${n===1 ? "una solución" : n + " soluciones"}${monto ? " para invertir USD " + fmt(monto) : ""}${c.perfil ? ", pensada para un perfil " + PERFIL[c.perfil].toLowerCase() : ""}. Abajo te detallamos cada una y por qué la recomendamos.`;
  return m;
}
function autoProp(){
  const P = S.prop, c = S.cliente; if (!P.items.length) return;
  if (!P.cliente && c.nombre) P.cliente = c.nombre;
  if (!P.monto && c.tenencia) P.monto = String(c.tenencia.reduce((a,h)=>a+h.usd,0));
  const free = P.items.filter(i=>i.pct===""||i.pct==null);
  if (free.length) { const used = P.items.reduce((a,i)=>a+(+i.pct||0),0), each = r1(Math.max(0,100-used)/free.length); free.forEach(i=>{ i.pct = String(each); i.src = i.src || "auto"; }); }
  const m = +P.monto; if (m) P.items.forEach(i=>{ if (i.src!=="usd" && i.pct!=="" && i.pct!=null) i.usd = String(Math.round(m*(+i.pct)/100)); });
  P.items.forEach(i=>{ const p = S.byId[i.id]; if (p && !i.edited) i.nota = autoNota(p); });
  if (!P.msgEdited) P.mensaje = autoMsg();
  persist();
}
async function aiTexts(btn){
  if (!S.sample || !S.prop.items.length) return;
  const label = btn.innerHTML; btn.disabled = true; btn.textContent = "Redactando…";
  const P = S.prop, c = S.cliente, items = P.items.map(i=>{ const p = S.byId[i.id]; return p && {id:p.id, nombre:p.nombre, que_es:p.cliente.queEs, pitch:p.interno.pitch, porcentaje:i.pct, usd:i.usd}; }).filter(Boolean);
  const prompt = `Sos un asesor de Neix, un ALyC argentino. Redactá los textos de una propuesta de inversión para un cliente, en español rioplatense, tono profesional y cercano, sin exagerar ni prometer rendimientos.
Cliente: ${JSON.stringify({nombre:P.cliente, tipo:TIPO[c.tipo]||"", perfil:c.perfil?PERFIL[c.perfil]:"", objetivos:c.objetivos.map(o=>OBJ[o]), situacion:c.eventos.map(e=>EVT[e]), tenencia_actual:c.tenencia?c.tenencia.map(h=>h.activo+" USD "+h.usd):null, monto_usd:P.monto})}
Soluciones propuestas: ${JSON.stringify(items)}
Respondé SOLO con JSON: {"mensaje":"3 o 4 oraciones que retomen la conversación y expliquen la lógica de la propuesta","notas":[{"id":"id de la solución","texto":"1 o 2 oraciones: por qué esta solución para este cliente"}]}. Usá solo la información dada; no inventes tasas ni datos.`;
  try {
    const r = await S.sample.json(prompt, {modelTier:"default"});
    if (r && r.mensaje) { P.mensaje = r.mensaje; P.msgEdited = true; }
    (r && r.notas || []).forEach(n => { const it = P.items.find(i=>i.id===n.id); if (it && n.texto) { it.nota = n.texto; it.edited = true; } });
    persist(); render(); toast("Textos redactados con IA");
  } catch(e) { toast(e && e.code==="rate_limited" ? "Demasiadas consultas seguidas. Probá en un minuto." : "No se pudo redactar. Probá de nuevo."); btn.disabled = false; btn.innerHTML = label; }
}
function rebalanceAuto(){ const P = S.prop, fixed = P.items.filter(i=>i.src==="pct"||i.src==="usd"), auto = P.items.filter(i=>!(i.src==="pct"||i.src==="usd")); const used = fixed.reduce((a,i)=>a+(+i.pct||0),0); auto.forEach(i=>{ i.pct = auto.length ? String(r1(Math.max(0,100-used)/auto.length)) : ""; i.src = "auto"; }); }
function resetTexts(){ S.prop.msgEdited = false; S.prop.items.forEach(i=>{ i.edited = false; }); persist(); render(); toast("Textos automáticos restablecidos"); }

/* ── Gestión ── */
function vGestion(){
  const rows = S.productos.slice().sort((a,b)=>(a.ultimaRevision||"").localeCompare(b.ultimaRevision||""));
  const obs = rows.reduce((a,p)=>a+p.observaciones.length,0);
  return `<div class="page-head"><div><div class="eyebrow">Gestión</div><h1>Fichas</h1>
  <p class="muted">Todas las fichas con su fecha de última actualización. Las más viejas aparecen primero.</p></div></div>
  <div class="tiles">${stat("Fichas", rows.length)}${stat("Pendientes del relevamiento", obs, obs>0)}</div>
  <div class="tw"><table><thead><tr><th>Ficha</th><th>Unidades</th><th>Actualizada</th><th class="r">Pend.</th><th></th></tr></thead><tbody>
  ${rows.map(p=>`<tr><td><a href="#p-${p.id}">${esc(p.nombre)}</a></td><td><span class="units" style="display:flex;gap:3px;flex-wrap:wrap">${units(p)}</span></td><td class="num">${fdate(p.ultimaRevision)}</td><td class="r num">${p.observaciones.length}</td><td><a href="#editar-${p.id}">Editar</a></td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ── Eventos ── */
document.addEventListener("click", e => {
  if (!e.target.closest(".asr")) document.querySelectorAll(".sug").forEach(sb=>{ sb.hidden = true; });
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  if (a==="fUnidad"||a==="fCat") { S[a] = S[a]===v && v ? "" : v; render(); }
  else if (a==="fNeed") { S.fNeed = S.fNeed===v ? "" : v; render(); }
  else if (a==="goCat") { S.fCat = v; S.fNeed = ""; S.q = ""; }
  else if (a==="clearF") { S.q=""; S.fUnidad=""; S.fCat=""; S.fEstado=""; S.fNeed=""; render(); }
  else if (a==="view") { S.view = v; render(); }
  else if (a==="persona") { S.persona = v; persist(); render(); const d = document.querySelector("details.fold"); if (d) d.open = true; }
  else if (a==="toggleProp") { const i = S.prop.items.findIndex(x=>x.id===id); if (i>=0) S.prop.items.splice(i,1); else { S.prop.items.push({id, nota:""}); toast("Sumada a la propuesta"); } rebalanceAuto(); persist(); render(); }
  else if (a==="mv") { const i = +b.dataset.i, d = +b.dataset.d, it = S.prop.items; [it[i], it[i+d]] = [it[i+d], it[i]]; persist(); render(); }
  else if (a==="copyWA") copy(waOnePager(S.byId[id]));
  else if (a==="copyText") copy(b.dataset.t);
  else if (a==="dlOnePager") { const p = S.byId[id], op = S.onepagers && S.onepagers[p.id]; if (op) { dlAsset(op, `${p.nombre} - Neix.pdf`, b); return; } const h = onePagerDoc(p); makePDF(h.slice(h.indexOf('<div class="pp">'), h.lastIndexOf("</body>")), `${p.nombre} - Neix.pdf`, b); }
  else if (a==="copyPropWA") copy(waProp());
  else if (a==="openWA") openWA();
  else if (a==="dlProp") makePDF(propDoc(), `Propuesta Neix${S.prop.cliente ? " - " + S.prop.cliente : ""}.pdf`, b);
  else if (a==="validar") validar(id);
  else if (a==="save") save(id);
  else if (a==="cset") { S.cliente[b.dataset.k] = S.cliente[b.dataset.k]===v ? "" : v; persist(); render(); }
  else if (a==="cmulti") { const arr = S.cliente[b.dataset.k], i = arr.indexOf(v); i>=0 ? arr.splice(i,1) : arr.push(v); persist(); render(); }
  else if (a==="resetC") { S.cliente = blankCliente(); persist(); render(); }
  else if (a==="consultar") consultar();
  else if (a==="demo") demoStart(v);
  else if (a==="presPDF") presPDF(b);
  else if (a==="presPreset") { const x = PRES_PRESETS[v]; S.pres.items = x.ids.filter(id=>S.byId[id]); S.pres.titulo = x.t; persist(); render(); }
  else if (a==="psmv") { const i = +b.dataset.i, d = +b.dataset.d, it = S.pres.items; [it[i], it[i+d]] = [it[i+d], it[i]]; persist(); render(); }
  else if (a==="aiTexts") aiTexts(b);
  else if (a==="resetTexts") resetTexts();
  else if (a==="pickAsesor") setAsesor(b.dataset.n, b.dataset.e, b.dataset.t, b.dataset.a);
  else if (a==="pickAsesorP") { Object.assign(S.pres, {asesor:b.dataset.n, mail:b.dataset.e, tel:b.dataset.t, area:b.dataset.a || S.pres.area || ""}); persist(); render(); toast(S.pres.area ? "Asesor y área completados" : "Elegí el área del asesor"); }
  else if (a==="meAsesor") { (async()=>{ const me = await S.user.me(); if (!me.name && !me.email) { toast("No pudimos leer tus datos"); return; } setAsesor(me.name || S.prop.asesor, me.email); })(); }
  else if (a==="hqAll") { S.q = ($("#hq")||{}).value || ""; go("soluciones"); }
  else if (a==="demoN") { const n = DEMO_STEPS[DEMO.k].length; if (DEMO.i < n-1) { DEMO.i++; demoApply(); } else { DEMO = null; coach(); window.scrollTo({top:0,behavior:"smooth"}); toast("Demo terminada"); } }
  else if (a==="demoP") { if (DEMO.i) { DEMO.i--; demoApply(); } }
  else if (a==="demoX") { DEMO = null; coach(); }
  else if (a==="aiRun") aiRun();
  else if (a==="login") { b.disabled = true; window.neixRuntime.login().catch(err => { b.disabled = false; if (err && err.code === "wrong_domain") toast("Usá tu cuenta de " + window.neixRuntime.dominio); else if (!(err && /popup-closed|cancelled-popup/.test(err.code||""))) toast("No se pudo iniciar sesión. Probá de nuevo."); }); }
  else if (a==="logout") { e.preventDefault(); window.neixRuntime.logout(); }
  else if (a==="modelProp") { modelProp(v); go("propuesta"); }
  else if (a==="extProp") { S.prop.ext = !S.prop.ext; persist(); render(); if (S.prop.ext) toast("Comparativo sumado a la propuesta"); }
  else if (a==="sim") { S.sim = v; render(); }
  else if (a==="openSim") { S.sim = v; S.simFrom = id || ""; }
  else if (a==="simset") { S.simv[S.sim][b.dataset.k] = v; $("#simForm").innerHTML = simForm(); calcSim(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id==="hq") homeResults(t.value);
  else if (t.id==="q") { S.q = t.value; const pos = t.selectionStart; render(); const n = $("#q"); if (n) { n.focus(); try { n.setSelectionRange(pos,pos); } catch(_){} } }
  else if (t.dataset.s && t.type!=="checkbox" && t.tagName!=="SELECT") { S.simv[S.sim][t.dataset.s] = t.value; calcSim(); }
  else if (t.dataset.pf) { S.prop[t.dataset.pf] = t.value; if (t.dataset.pf==="monto") { usdFromPct(null, true); pctFromUsd(); }
    if (t.dataset.pf==="mensaje") S.prop.msgEdited = true; persist(); refreshPreview(); if (t.id==="pr_asesor") asesorSearch(t.value); }
  else if (t.dataset.pp) { const it = S.prop.items[+t.dataset.pp]; it.pct = t.value; it.src = "pct"; usdFromPct(+t.dataset.pp); persist(); refreshPreview(); }
  else if (t.dataset.pu) { const it = S.prop.items[+t.dataset.pu]; it.usd = t.value; it.src = "usd"; pctFromUsd(); persist(); refreshPreview(); }
  else if (t.dataset.ps) { S.pres[t.dataset.ps] = t.value; persist(); if (t.id==="ps_asesor") asesorSearch(t.value, "ps_asesor", "psAsesorSug", "pickAsesorP"); const sl = $("#slides"); if (sl && S.pres.items.length) { sl.innerHTML = presSlides().map(h=>`<div class="slw">${h}</div>`).join(""); fitSlides(); } }
  else if (t.id==="ps_q") { S.pres.q = t.value; const pos = t.selectionStart; render(); const n = $("#ps_q"); if (n) { n.focus(); try { n.setSelectionRange(pos,pos); } catch(_){} } }
  else if (t.dataset.pi) { const it = S.prop.items[+t.dataset.pi]; it.nota = t.value; it.edited = true; persist(); refreshPreview(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id==="fEstado") { S.fEstado = t.value; render(); }
  else if (t.id==="pr_comit") propComitente(t.value);
  else if (t.id==="pr_area") { S.prop.area = t.value; saveArea(S.prop.asesor, t.value); persist(); refreshPreview(); }
  else if (t.id==="ps_area") { S.pres.area = t.value; saveArea(S.pres.asesor, t.value); persist(); render(); }
  else if (t.dataset.psi) { const id = t.dataset.psi, it = S.pres.items, i = it.indexOf(id); if (t.checked && i<0) it.push(id); if (!t.checked && i>=0) it.splice(i,1); persist(); render(); }
  else if (t.dataset.pst) { S.pres[t.dataset.pst] = t.checked; persist(); render(); }
  else if (t.id==="pr_modelo") { if (t.value) { modelProp(t.value); render(); } }
  else if (t.dataset.pt) { S.prop[t.dataset.pt] = t.checked; persist(); refreshPreview(); }
  else if (t.id==="patrimonio") { S.cliente.patrimonio = t.value; persist(); render(); }
  else if (t.dataset.s && (t.tagName==="SELECT" || t.type==="checkbox")) { S.simv[S.sim][t.dataset.s] = t.type==="checkbox" ? t.checked : +t.value; $("#simForm").innerHTML = simForm(); calcSim(); }
});
document.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.id==="comitente") consultar(); if (e.key==="Enter" && e.target.id==="hq" && e.target.value.trim()) { S.q = e.target.value; go("soluciones"); } });
function homeResults(v){
  const box = $("#hres"); if (!box) return; const q = v.trim().toLowerCase();
  if (!q) { box.innerHTML = ""; return; }
  const hits = S.productos.filter(p => (p.nombre+" "+p.cliente.titular+" "+p.categoria+" "+p.interno.perfiles.join(" ")+" "+p.unidades.join(" ")).toLowerCase().includes(q));
  box.innerHTML = `<div class="hres">${hits.length ? hits.slice(0,6).map(p=>`<a href="#p-${p.id}"><b>${esc(p.nombre)}</b><span>${esc(p.cliente.titular)}</span></a>`).join("") + (hits.length>6?`<button data-act="hqAll">Ver los ${hits.length} resultados</button>`:"") : `<p>No encontramos soluciones para "${esc(v.trim())}".</p>`}</div>`;
}

/* ── Arranque ── */
function setProductos(list){ S.productos = list.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")); S.byId = {}; list.forEach(p=>S.byId[p.id]=p); }
function softRender(){ const a = document.activeElement; if (a && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && a.type!=="checkbox"))) return; render(); }
async function boot(){
  const st = document.createElement("style"); st.textContent = PP_CSS; document.head.appendChild(st);
  render(true);
  const c = window.neixRuntime;
  if (!c || !c.use) { S.loading = false; S.dbMissing = true; render(); return; }
  c.use("downloads").then(d => { S.dl = d; });
  if (c.session) c.session().then(s => { const el = $("#sesion"); if (!s || !el) return; el.innerHTML = `${esc(s.email)} · <a href="#" data-act="logout">Salir</a>`; el.hidden = false; }).catch(()=>{});
  c.use("sample").then(sm => { S.sample = sm; if (S.cliente.tenencia) softRender(); });
  c.use("user").then(async u => { if (!u) return; S.user = u; try { S.canEdit = !!(await u.canEdit()); S.uid = await u.id(); } catch(_){} render(); });
  const db = await c.use("db");
  if (!db) { S.loading = false; S.dbMissing = true; render(); return; }
  S.db = db;
  const timer = setTimeout(()=>{ S.slow = true; render(); }, 10000);
  db.collection("productos").onSnapshot(snap => {
    setProductos(snap.docs.map(d=>Object.assign({id:d.id}, JSON.parse(JSON.stringify(d.data())))));
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.loading = false; S.slow = false; }
    softRender();
  }, () => { clearTimeout(timer); S.loading = false; render(); });
  db.collection("validaciones").onSnapshot(snap => { const v = {}; snap.docs.forEach(d=>v[d.id]=d.data()); S.vals = v; if (S.productos.length) softRender(); }, ()=>{});
  db.doc("config/onepagers").onSnapshot(d => { S.onepagers = d.exists ? (d.data().map||{}) : {}; }, ()=>{});
  db.doc("config/asesores").onSnapshot(d => { S.asesores = d.exists ? (d.data().lista||[]) : []; }, ()=>{});
  db.doc("config/exterior").onSnapshot(d => { S.ext = d.exists ? d.data() : null; if (S.productos.length) softRender(); }, ()=>{});
  db.doc("config/impuestos").onSnapshot(d => { S.imp = d.exists ? d.data() : null; if (S.productos.length) softRender(); }, ()=>{});
}
boot();
})();
</script>
